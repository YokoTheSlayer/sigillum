[workspace]
members = [
    "crates/sigillum-cli",
    "crates/sigillum-core",
    "crates/sigillum-openspec",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.81"
license = "Apache-2.0"
repository = "https://github.com/YokoTheSlayer/sigillum"
authors = ["Sigillum contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = true
strip = true
